<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MusicRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Hidden YouTube player target: audio only, no visible video -->
  <div id="yt-player-mount" aria-hidden="true"></div>

  <!-- ---------------- JOIN SCREEN ---------------- -->
  <section id="join-screen" class="screen">
    <div class="join-card">
      <div class="join-logo">🎧</div>
      <h1>MusicRoom</h1>
      <p class="subtitle">A little room for just the two of you.</p>

      <form id="join-form">
        <input type="text" id="name-input" placeholder="Your name" autocomplete="off" required />
        <input type="password" id="code-input" placeholder="Room code" autocomplete="off" required />
        <button type="submit">Enter room</button>
      </form>
      <p id="join-error" class="error-text"></p>
    </div>
  </section>

  <!-- ---------------- MAIN APP ---------------- -->
  <section id="app-screen" class="screen hidden">

    <div class="backdrop" id="backdrop"></div>

    <header class="topbar">
      <span class="brand">🎧 MusicRoom</span>
      <span id="now-playing-friend" class="friend-indicator hidden"></span>
    </header>

    <main class="main-layout">

      <!-- Player -->
      <div class="player-card">
        <div class="cover-wrap">
          <img id="cover-art" class="cover-art" src="" alt="Cover art" />
        </div>

        <div class="track-info">
          <h2 id="track-title">Nothing playing yet</h2>
          <p id="track-artist">Add a song to get started</p>
        </div>

        <div class="progress-row">
          <span id="time-current" class="time">0:00</span>
          <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" />
          <span id="time-duration" class="time">0:00</span>
        </div>

        <div class="controls-row">
          <button id="btn-prev" class="control-btn" title="Previous">⏮</button>
          <button id="btn-playpause" class="control-btn control-btn--main" title="Play/Pause">▶</button>
          <button id="btn-next" class="control-btn" title="Next">⏭</button>
        </div>

        <div class="volume-row">
          <span class="vol-icon">🔊</span>
          <input type="range" id="volume-bar" min="0" max="100" value="70" />
        </div>
      </div>

      <!-- Playlist -->
      <div class="playlist-card">
        <h3>Playlist</h3>

        <form id="add-form" class="add-form">
          <input type="text" id="add-input" placeholder="Paste a YouTube link…" autocomplete="off" required />
          <button type="submit">Add</button>
        </form>
        <p id="add-error" class="error-text"></p>

        <ul id="playlist-list" class="playlist-list"></ul>
        <p id="playlist-empty" class="empty-text">No songs yet — add your first one above.</p>
      </div>

    </main>
  </section>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
